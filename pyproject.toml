[project]
name = "psk"
version = "1.0.0"
description = "A process management tool with clean CLI interface"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.19.2",
    "rich>=14.2.0",
    "questionary>=2.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
psk = "src.cli.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typer.confirm".msg = "Use prompt_utils.select_yes_no for confirmations"
"typer.prompt".msg = "Use prompt_utils.input_text for text and select_single for choices"
"click.confirm".msg = "Use prompt_utils.select_yes_no for confirmations"
"click.prompt".msg = "Use prompt_utils.input_text for text and select_single for choices"
"questionary".msg = "Use the standard prompt_utils (select_*, input_text)"
"rich.prompt".msg = "Use the standard prompt_utils (select_*, input_text)"
